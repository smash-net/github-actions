#
#  This workflow is used to deploy 1 container
#
name: deploy-workflow
run-name: Deploy
on:
  workflow_call:
    inputs:
      ecs-aws-account-id:
        required: true
        type: string
      ecr-aws-account-id:
        required: true
        type: string
      ecr-aws-region:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      app-image-name:
        required: true
        type: string
      ecs-stack-name:
        required: true
        type: string
      release-tag:
        required: true
        type: string
      container:
        required: true
        type: string
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
      wait-for-minutes:
        description: >-
          How long to wait for the service to become stable. Raise it for services whose old tasks
          can hold off a deploy, such as workers with scale-in protection. At most 50, so the wait
          fits in the githubAccess role's 1-hour session.
        type: number
        required: false
        default: 10

jobs:
  deploy-pipeline:
    name: deploy
    runs-on: ${{ inputs.runs-on }}
    env:
      ACTIONS_STEP_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Size the AWS session to the stability wait
        id: aws-session
        env:
          WAIT_FOR_MINUTES: "${{ inputs.wait-for-minutes }}"
        run: |
          # githubAccess allows at most 1 hour; STS requires at least 15 minutes. The steps around
          # the wait (lookups, task definition, SSM update) get 10 minutes of headroom.
          MIN_SESSION_SECONDS=900
          MAX_SESSION_SECONDS=3600
          SESSION_HEADROOM_SECONDS=600

          needed_seconds=$(( WAIT_FOR_MINUTES * 60 + SESSION_HEADROOM_SECONDS ))
          if (( WAIT_FOR_MINUTES < 1 || needed_seconds > MAX_SESSION_SECONDS )); then
            echo "::error::wait-for-minutes must be 1-$(( (MAX_SESSION_SECONDS - SESSION_HEADROOM_SECONDS) / 60 )) to fit the role's 1-hour session, got ${WAIT_FOR_MINUTES}"
            exit 1
          fi
          echo "role-duration-seconds=$(( needed_seconds < MIN_SESSION_SECONDS ? MIN_SESSION_SECONDS : needed_seconds ))" >> "$GITHUB_OUTPUT"

      - name: Assume InfraDeployGitHub
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: "${{ inputs.aws-region }}"
          role-to-assume: "arn:aws:iam::${{ inputs.ecs-aws-account-id }}:role/githubAccess"
          role-duration-seconds: "${{ steps.aws-session.outputs.role-duration-seconds }}"

      - name: Fetch ECS Details
        id: fetch-cloudformation-ecs-stack-details
        uses: smash-net/github-actions/.github/actions/fetch-cloudformation-ecs-stack-details@feature/infraless-ecs-setup
        with:
          aws-region: "${{ inputs.aws-region }}"
          ecs-stack-name: "${{ inputs.ecs-stack-name }}"

      - name: Get task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition ${{steps.fetch-cloudformation-ecs-stack-details.outputs.ecs-task-definition-name}} \
          --query taskDefinition > task-definition.json
          cat task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition for the container
        id: task-def-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1.5.0
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container }}
          image: "${{ inputs.ecr-aws-account-id }}.dkr.ecr.${{ inputs.ecr-aws-region }}.amazonaws.com/${{ inputs.app-image-name }}:${{ inputs.release-tag }}"

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-container.outputs.task-definition }}
          service: "${{ steps.fetch-cloudformation-ecs-stack-details.outputs.ecs-service-name }}"
          cluster: "${{ steps.fetch-cloudformation-ecs-stack-details.outputs.ecs-cluster-name }}"
          wait-for-service-stability: true
          wait-for-minutes: "${{ inputs.wait-for-minutes }}"
          # The SDK waiter backs off up to 600s between polls and gives up as soon as the next
          # delay would pass the deadline, so without a cap it stops after ~4 minutes, not 10.
          wait-max-delay-seconds: 30
      
      - name: Update SSM latest image tag parameters
        run: |
           aws ssm put-parameter --name "/latest-tags/${{ inputs.ecs-stack-name }}/${{ inputs.app-image-name }}" --type "String" --value "${{ inputs.release-tag }}" --overwrite
